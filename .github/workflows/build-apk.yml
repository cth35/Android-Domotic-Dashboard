name: Build & Release APK

on:
  push:
    tags:
      - "v*"          # Se déclenche lors du push d'un tag v1.0.0, etc.
  workflow_dispatch:   # Permet aussi de lancer le build manuellement depuis GitHub

permissions:
  contents: write      # Nécessaire pour créer la Release GitHub et y attacher les APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rendre gradlew exécutable & Builder les APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Préparer et renommer les APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Domotic-Dashboard-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/Domotic-Dashboard-release-unsigned.apk

      - name: Sauvegarder les artefacts (pour lancements manuels)
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Publier la Release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
